<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Spacing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-Margin->
    <h3>Margin</h3>
    <div class="m-[100px] bg-stone-200">Margin All Around</div>
    <div class="mx-5 bg-yellow-400">Margin from X axis</div>
    <div class="my-5 bg-pink-500">Margin from Y axis</div>
    <div class="mt-5 bg-green-600">Margin Top</div>
    <div class="mb-5 bg-blue-600">Margin Bottom</div>
    <div class="ml-5 bg-purple-600">Margin Left</div>
    <div class="mr-5 bg-red-600">Margin Right</div>
    <br>
    <hr>
    <br>
    <!-Padding->
    <h2>Padding</h2>
    <div class="p-4 bg-lime-100">Padding All Around</div>
    <div class="px-5 bg-lime-400">Padding X axis</div>
    <div class="py-6 bg-red-500">Padding Y axis</div>
    <div class="pt-6 bg-blue-500">Padding Top</div>
    <div class="pb-6 bg-green-500">Padding Bottom</div>
    <div class="pl-6 bg-yellow-500">Padding Left</div>
    <div class="pr-6 bg-orange-500">Padding Right</div>
    <br>
    <hr>
    <br>
    <!-Space->
    <h2>Space Between</h2>
    <div class="flex space-x-4">
    <div class="p-3 bg-teal-100">01</div>
    <div class="p-3 bg-teal-200">02</div>
    <div class="p-3 bg-teal-300">03</div>
    <div class="p-3 bg-teal-400">04</div>
    <div class="p-3 bg-teal-500">05</div>
    </div>


    <h2>Space Between Y</h2>
    <div class="flex flex-col space-y-4">
    <div class="p-3 bg-teal-100">01</div>
    <div class="p-3 bg-teal-200">02</div>
    <div class="p-3 bg-teal-300">03</div>
    <div class="p-3 bg-teal-400">04</div>
    <div class="p-3 bg-teal-500">05</div>
    </div>

</body>
</html>
